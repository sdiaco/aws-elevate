{{define "content"}}<div class="page-head"><h1>{{.Title}}</h1></div>
<div class="box confirm"><form method="post" action="{{.Action}}">
{{if .Text}}<p>{{.Text}}</p>{{end}}
<ul class="ids">{{range .IDs}}<li><code>{{.}}</code><input type="hidden" name="id" value="{{.}}"></li>{{end}}</ul>
{{if .Reason}}<div class="field"><label for="reason">Reason</label>
<span class="desc">Recorded with each grant and shown in the history.</span>
<textarea name="reason" id="reason" rows="3" required></textarea></div>{{end}}
<div class="form-actions"><a class="btn link" href="{{.Back}}" data-close autofocus>Go back</a><button class="btn primary">{{.Button}}</button></div>
</form></div>{{end}}
